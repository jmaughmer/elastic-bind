// BIND9 logging stanza for the Elasticsearch pipeline in this directory.
// Drop this into named.conf (or an included file). All 17 categories are
// routed to a single channel/file so Filebeat/Elastic Agent only has to
// tail one path.
//
// print-time yes is used instead of "iso8601-utc" because that value isn't
// recognized by BIND 9.11's print-time (it was added in a later release) —
// named will refuse to start with "unknown or out of range" if you set it
// on 9.11. "yes" produces the legacy "14-Aug-2026 10:23:45.678" format,
// which bind-ingest-pipeline.json parses as its PRIMARY format now.
//
// The catch: that legacy format has no UTC offset, it's just the server's
// local clock. You MUST tell the pipeline what timezone that is — set
// event.timezone in elastic-agent-custom-logs.yml's "fields" block to this
// server's IANA timezone (e.g. "America/Chicago"), or every @timestamp
// will silently be off by the UTC offset (the pipeline defaults to UTC if
// you don't).
//
// If you're on BIND 9.12+ and confirm "iso8601-utc" is accepted (check
// `named-checkconf` or your version's ARM), it's still worth switching to —
// it sidesteps the timezone problem entirely and the pipeline already
// tries it as a fallback format.
logging {
    channel elastic_log {
        file "/var/log/named/named.log" versions 10 size 100m;
        print-time yes;
        print-severity yes;
        print-category yes;
        severity info;   // use "dynamic" to inherit -d debug level if you run named -d
    };

    category default      { elastic_log; };
    category general       { elastic_log; };
    category database      { elastic_log; };
    category security      { elastic_log; };
    category config        { elastic_log; };
    category resolver      { elastic_log; };
    category xfer-in       { elastic_log; };
    category xfer-out      { elastic_log; };
    category notify        { elastic_log; };
    category client        { elastic_log; };
    category unmatched     { elastic_log; };
    category queries       { elastic_log; };
    category network       { elastic_log; };
    category update        { elastic_log; };
    category dispatch      { elastic_log; };
    category dnssec        { elastic_log; };
    category lame-servers  { elastic_log; };
};
